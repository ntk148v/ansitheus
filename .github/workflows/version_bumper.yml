name: Check for new upstream releases

on:
  schedule:
    - cron: "5 4 * * 1"
  workflow_dispatch: {}
  # Delete the bump branch when its PR is merged or closed.
  pull_request:
    types:
      - closed
    branches:
      - "master"

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  discover:
    name: Discover available updates
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Discover role updates
        id: discover
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/discover_versions.py

  bump:
    name: Bump ${{ matrix.role }} to ${{ matrix.new_version }}
    needs: discover
    if: needs.discover.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Apply version update
        env:
          ROLE_NAME: ${{ matrix.role }}
          NEW_VERSION: ${{ matrix.new_version }}
          REPO: https://${{ matrix.host }}/${{ matrix.repo }}
        run: python .github/scripts/version_bump.py --role "${ROLE_NAME}" --new-version "${NEW_VERSION}" --repo "${REPO}"

      - name: Check git status
        id: git_state
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        id: cpr
        if: steps.git_state.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: autoupdate/${{ matrix.role }}/${{ matrix.new_version }}
          delete-branch: true
          commit-message: "chore(${{ matrix.role }}): bump to ${{ matrix.new_version }}"
          title: "patch(${{ matrix.role }}): bump to ${{ matrix.new_version }}"
          body-path: /tmp/version-bump-report-${{ matrix.role }}-${{ matrix.new_version }}.md

      # PRs created with GITHUB_TOKEN do not trigger pull_request workflows,
      # but workflow_dispatch does. Run e2e on the bump branch explicitly.
      - name: Run e2e tests on the bump branch
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: autoupdate/${{ matrix.role }}/${{ matrix.new_version }}
        run: gh workflow run e2e.yml --repo "${{ github.repository }}" --ref "${BRANCH}"

      # The new PR always carries the latest version, so older bump PRs
      # for the same role are obsolete.
      - name: Close older bump PRs for this role
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLE_NAME: ${{ matrix.role }}
          NEW_PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json number,headRefName \
            | jq -r --arg prefix "autoupdate/${ROLE_NAME}/" --argjson keep "$NEW_PR" \
                '.[] | select((.headRefName | startswith($prefix)) and .number != $keep) | .number' \
            | while read -r pr; do
                echo "Closing #${pr} (superseded by #${NEW_PR})"
                gh pr close "$pr" --repo "$GITHUB_REPOSITORY" --delete-branch \
                  --comment "Superseded by #${NEW_PR}."
              done

      - name: No changes
        if: steps.git_state.outputs.changed != 'true'
        run: echo "No updates were required for ${{ matrix.role }}."

  cleanup:
    name: Delete bump branch
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.event.pull_request.head.ref, 'autoupdate/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if gh api --silent -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}"; then
            echo "Deleted ${BRANCH}"
          else
            echo "Branch ${BRANCH} is already deleted"
          fi
